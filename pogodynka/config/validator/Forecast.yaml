
App\Entity\Forecast:
    properties:
        Place:
            - NotNull:
                  message: 'Place is required'
                  groups: [new, edit]

        date:
            - NotNull:
                  message: 'Date is required'
                  groups: [new, edit]

        temperature:
            - NotNull:
                  message: 'Temperature is required'
                  groups: [new, edit]
            - Range:
                  min: -100
                  max: 60
                  notInRangeMessage: 'Temperature must be between -100 and 60'
                  groups: [new]
            - Range:
                  min: -90
                  max: 55
                  notInRangeMessage: 'Temperature must be between -90 and 55'
                  groups: [edit]

        Predicted_Rainfall:
            - NotNull:
                  message: 'Predicted rainfall is required'
                  groups: [new, edit]
            - PositiveOrZero:
                  message: 'Rainfall cannot be negative'
                  groups: [new, edit]

        humidity:
            - NotNull:
                  message: 'Humidity is required'
                  groups: [new, edit]
            - Range:
                  min: 0
                  max: 100
                  notInRangeMessage: 'Humidity must be between 0 and 100'
                  groups: [new, edit]

        wind:
            - NotNull:
                  message: 'Wind is required'
                  groups: [new, edit]
            - PositiveOrZero:
                  message: 'Wind cannot be negative'
                  groups: [new, edit]
